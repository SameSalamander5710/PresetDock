name: Release Windows Build

on:
  push:
    branches: [main]
    # Don't burn a release on doc-only commits
    paths-ignore:
      - "docs/**"
      - "**.md"

# Least-privilege by default; only the jobs that need write access get it
permissions:
  contents: read

# If two pushes land close together, cancel the older run instead of
# racing two releases against each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    # Native Windows runner: the repo has windows-only code without a
    # "_windows.go" filename suffix, so it won't even vet on Linux, and a
    # cross-compiled test binary can't be executed on a Linux host anyway.
    runs-on: windows-latest
    permissions:
      contents: write        # to create the GitHub Release
      id-token: write        # to mint the OIDC token for Sigstore
      attestations: write    # to publish the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Determine version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build Windows binary
        run: go build -trimpath -ldflags "-H=windowsgui -s -w -X presetdock/backend.version=${{ steps.version.outputs.version }}" -o PresetDock.exe ./backend

      - name: Generate checksum
        shell: bash
        run: sha256sum PresetDock.exe > PresetDock.exe.sha256

      # Free alternative to a paid code-signing certificate: this produces a
      # signed, publicly-verifiable attestation ("this exact file was built
      # by this exact commit, in this exact repo's Actions run") without
      # needing to buy anything. Verify with:
      #   gh attestation verify PresetDock.exe -R SameSalamander5710/PresetDock
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: PresetDock.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PresetDock v${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})
          generate_release_notes: true
          files: |
            PresetDock.exe
            PresetDock.exe.sha256
