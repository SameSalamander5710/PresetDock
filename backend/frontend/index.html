<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PresetDock</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Load modules in dependency order -->
    <script src="/state.js" defer></script>
    <script src="/dom.js" defer></script>
    <script src="/api" defer></script>
    <script src="/heartbeat.js" defer></script>
    <script src="/panes.js" defer></script>
    <script src="/dialogs.js" defer></script>
    <script src="/actions.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Local llama.cpp launcher</p>
        <h1>PresetDock</h1>
        <p class="lede">
          Create a code preset, and launch it directly into a fresh terminal.
        </p>
      </section>

      <section class="content">
        <div id="status" class="status" role="status" aria-live="polite">Loading presets...</div>
        <div class="global-toolbar">
          <div class="global-toolbar-left">
            <button id="view-toggle" type="button" class="secondary-button" title="Toggle single/dual view">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
              <span>Dual View</span>
            </button>
          </div>
          <div class="global-toolbar-right">
            <button id="create-button" type="button" class="secondary-button">Create</button>
            <button id="decks-button" type="button" class="secondary-button" title="Manage decks">🗂 Decks</button>
            <button id="shutdown-button" type="button" class="subtle-button" title="Stop the PresetDock server">Shut down</button>
          </div>
        </div>

        <!-- Split-view container -->
        <div id="split-container" class="split-container single-mode">
          <!-- Left pane -->
          <div id="pane-left" class="pane">
            <div class="pane-search-bar" role="search">
              <div class="search-input-wrap">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="pane-search-input" type="search" placeholder="Search presets by name, tag, or engine..." autocomplete="off" />
                <button class="pane-search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
              </div>
              <div class="pane-search-suggestions" role="listbox"></div>
              <div class="pane-filter-chips"></div>
            </div>
            <div class="pane-toolbar">
              <span class="pane-filter-count"></span>
              <div class="pane-toolbar-actions">
                <select class="pane-deck-selector" title="Filter by deck">
                  <option value="">All presets</option>
                </select>
              </div>
            </div>
            <div class="pane-presets grid" aria-live="polite"></div>
          </div>

          <!-- Right pane (hidden in single mode) -->
          <div id="pane-right" class="pane" hidden>
            <div class="pane-search-bar" role="search">
              <div class="search-input-wrap">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="pane-search-input" type="search" placeholder="Search presets by name, tag, or engine..." autocomplete="off" />
                <button class="pane-search-clear" type="button" aria-label="Clear search" hidden>&times;</button>
              </div>
              <div class="pane-search-suggestions" role="listbox"></div>
              <div class="pane-filter-chips"></div>
            </div>
            <div class="pane-toolbar">
              <span class="pane-filter-count"></span>
              <div class="pane-toolbar-actions">
                <select class="pane-deck-selector" title="Filter by deck">
                  <option value="">All presets</option>
                </select>
              </div>
            </div>
            <div class="pane-presets grid" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="preset-dialog" class="preset-dialog">
      <form id="preset-editor" class="editor-shell">
        <div class="dialog-header">
          <div>
            <h2 id="preset-dialog-title">Create preset</h2>
            <p id="preset-dialog-subtitle">Fill out the fields and save the preset JSON.</p>
          </div>
          <button id="editor-close" type="button" class="secondary-button">Close</button>
        </div>

        <div class="field-grid">
          <label class="field">
            <span class="field-label">Name</span>
            <input id="preset-name" name="name" type="text" placeholder="Gemma 4 E4B - Q4" />
          </label>
          <label class="field">
            <span class="field-label">Engine</span>
            <input id="preset-engine" name="engine" type="text" placeholder="llama-cli or llama-server" />
          </label>
          <label class="field">
            <span class="field-label">Model</span>
            <input id="preset-model" name="model" type="text" placeholder="gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL" />
          </label>
          <label class="field full-width">
            <span class="field-label">Tags</span>
            <textarea id="preset-tags" name="tags" rows="3" placeholder="gemma, E4B, QAT, Q4"></textarea>
          </label>
          <label class="field full-width">
            <span class="field-label">Description</span>
            <textarea id="preset-description" name="description" rows="3" placeholder="General purpose, balanced speed/quality"></textarea>
          </label>
          <label class="field full-width">
            <span class="field-label">Command</span>
            <div class="command-editor-wrap">
              <textarea id="preset-command" name="command" rows="7" placeholder="llama-cli -m models/..."></textarea>
              <button type="button" id="copy-command-btn" class="copy-button" title="Copy command" aria-label="Copy command to clipboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </label>
        </div>

        <div class="dialog-footer">
          <span id="preset-editor-feedback" class="feedback"></span>
          <div class="dialog-actions">
            <button id="editor-cancel" type="button" class="secondary-button">Cancel</button>
            <button id="editor-run" type="button">Run</button>
            <button id="editor-save" type="submit">Save preset</button>
          </div>
        </div>
      </form>
    </dialog>

    <!-- Decks Management Dialog -->
    <dialog id="decks-dialog" class="decks-dialog">
      <div class="decks-shell">
        <div class="dialog-header">
          <div>
            <h2>Manage Decks</h2>
            <p>Create, edit, and organize decks to group your presets.</p>
          </div>
          <button id="decks-close" type="button" class="secondary-button">Close</button>
        </div>

        <div class="decks-layout">
          <div class="decks-list-panel">
            <div class="decks-list-header">
              <h3>Decks</h3>
              <button id="deck-new-button" type="button" class="secondary-button">New Deck</button>
            </div>
            <div id="decks-list" class="decks-list"></div>
          </div>

          <div class="deck-editor-panel" id="deck-editor-panel">
            <div id="deck-editor-empty" class="deck-editor-empty">
              <p>Select or create a deck to edit.</p>
            </div>
            <div id="deck-editor-form" class="deck-editor-form" hidden>
              <label class="field">
                <span class="field-label">Deck Name</span>
                <input id="deck-name-input" type="text" placeholder="My Deck" />
              </label>

              <div class="deck-presets-selector">
                <label class="field">
                  <span class="field-label">Presets in this deck</span>
                  <div class="deck-presets-search-wrap">
                    <input id="deck-presets-search" type="search" placeholder="Search presets..." />
                  </div>
                  <div id="deck-presets-list" class="deck-presets-list"></div>
                </label>
              </div>

              <div class="deck-editor-actions">
                <button id="deck-save-button" type="button">Save Deck</button>
                <button id="deck-delete-button" type="button" class="danger-button">Delete Deck</button>
              </div>
              <span id="deck-feedback" class="feedback"></span>
            </div>
          </div>
        </div>
      </div>
    </dialog>
  </body>
</html>
